; Copy this file to bridge.ini (same folder) and fill it in. Never share bridge.ini: it holds the token.

[device]
; The machine's IP on the office network: on the K50, Menu > Comm. > Ethernet > IP Address
ip = 192.168.1.201
port = 4370
; Comm. password on the machine (Menu > Comm. > Connection / Comm Key). 0 if none.
password = 0
name = K50

[app]
url = https://os.amzcentric.com
; The ATTENDANCE_TOKEN value set in Vercel
token = paste-the-token-here
